plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.gradleup.shadow' version '8.3.9'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Kotlin for the SDK comes from Fabric Language Kotlin at runtime (see shading.gradle)

    // Minecraft already ships slf4j; everything else is bundled into the mod jar.
    shade("com.anthropic:anthropic-java:${project.anthropic_version}") { exclude group: 'org.slf4j' }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

apply from: 'shading.gradle'
shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = 'dev-shadow'
    applyShading(it)
}
remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}
