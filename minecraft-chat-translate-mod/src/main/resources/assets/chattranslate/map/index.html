<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即時地圖</title>
<style>
:root { --bg: #141816; --panel: #1d2220; --fg: #e4e9e5; --muted: #9aa49e; --line: #313a35; --accent: #f97316; --route: #22d3ee; --map: #0c0e0d;
  font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); display: flex; flex-direction: column; font-size: 14px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.pos { font-family: Consolas, monospace; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
select, button, input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; }
button.on { background: var(--accent); border-color: var(--accent); color: #1a0d04; }
button.nav { background: var(--route); border-color: var(--route); color: #04181c; }
.main { flex: 1; min-height: 0; display: flex; }
.wrap { position: relative; flex: 1; min-width: 0; background: var(--map); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.adding { cursor: crosshair; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; padding: 0; }
.note { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; color: var(--muted); max-width: 80%; }
.guide { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(0,0,0,.75); border: 2px solid var(--route); border-radius: 10px; padding: 8px 18px; text-align: center; }
.guide b { display: block; font-size: 26px; color: var(--route); }
.side { width: 290px; flex: none; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.side h2 { font-size: 14px; margin: 0; padding: 10px 12px 6px; }
.add { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
.add input { flex: 1 1 100%; box-sizing: border-box; }
ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
li { padding: 8px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
li.done .name { text-decoration: line-through; color: var(--muted); }
li .meta { grid-column: 1; font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
li .acts { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 4px; flex-wrap: wrap; justify-content: end; }
li .acts button { padding: 2px 8px; font-size: 12px; }
.empty { padding: 12px; color: var(--muted); }
.diag { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 12px; max-height: 45%; overflow-y: auto; }
.diag summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.diag .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.diag .row span { min-width: 0; }
.diag button { padding: 1px 8px; font-size: 12px; white-space: nowrap; flex: none; }
.diag .bad { color: #f87171; } .diag .good { color: #4ade80; }
.diag pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--muted); font-size: 11px; }
@media (max-width: 700px) { .main { flex-direction: column; } .side { width: auto; height: 40%; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="bar">
  <span class="pos" id="pos">等待遊戲…</span>
  <span class="muted" id="dim"></span>
  <label>圖層 <select id="layer"><option value="auto">自動（跟著高度）</option></select></label>
  <button id="follow" class="on" type="button">跟著我</button>
  <button id="nearest" class="nav" type="button">帶我去最近的紙張</button>
  <button id="stop" type="button" hidden>停止導航</button>
  <button id="walk" class="on" type="button">清楚地圖</button>
</div>
<div class="main">
  <div class="wrap">
    <canvas id="map"></canvas>
    <div class="guide" id="guide" hidden><b id="turn"></b><span id="left"></span></div>
    <div class="zoom"><button id="zin" type="button" aria-label="放大">＋</button><button id="zout" type="button" aria-label="縮小">－</button></div>
    <div class="note" id="note" hidden></div>
  </div>
  <div class="side">
    <h2>標記</h2>
    <div class="add">
      <input id="label" type="text" placeholder="名稱（例如：紙張 3）" maxlength="40">
      <select id="kind"><option value="paper">紙張</option><option value="dead">死路</option><option value="note">其他</option></select>
      <button id="here" type="button">標在我腳下</button>
      <button id="pick" type="button">在地圖上點</button>
    </div>
    <ul id="list"></ul>
    <details class="diag" id="diag">
      <summary>診斷 <span class="muted" id="diagSum"></span></summary>
      <div id="diagCopies"></div>
      <div class="muted" id="diagCal"></div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px">
        <button id="realign" type="button">重新對齊</button>
        <button id="report" type="button">複製診斷報告</button>
      </div>
      <pre id="diagLog"></pre>
      <textarea id="reportText" hidden rows="6" style="width:100%; box-sizing:border-box; margin-top:6px"></textarea>
    </details>
  </div>
</div>
<script>
(() => {
  // Each visit to the Backrooms puts you in a fresh copy of the same maze somewhere else along X.
  // Earlier copies' maps are lined up with the copy you're in by matching their corridors, then stacked.
  const TILE = 512, KIND = { paper: ['紙張', '#facc15'], dead: ['死路', '#ef4444'], note: ['其他', '#a78bfa'] };
  const $ = id => document.getElementById(id);
  const cv = $('map'), ctx = cv.getContext('2d'), sel = $('layer');
  const view = { cx: 0, cz: 0, scale: 2 };
  let me = null, follow = true, layers = [], version = Date.now(), adding = false, clear = true;
  let markers = [], bundled = [], doneBundled = new Set();
  let target = null, route = null, routeAt = 0;
  const tiles = new Map();  // "layer|x,z" -> Image | 'missing'
  const merged = new Map(), mergeJobs = new Map(); // "layer|x,z" in your copy's coordinates -> canvas
  const alignCache = new Map(); // "copy|your copy" -> {dx, dz, ok}
  let copies = []; // the copies JourneyMap saved: {n (world folder), x0, x1 (tile columns), dx, dz, ok}
  const isBR = () => !!me && /backroom/i.test(me.dim);
  // 0 = not mapped (transparent, or the dark blue JourneyMap paints around caves), 1 = floor, 2 = wall
  // how dark a mapped pixel must be to count as wall; tuned from where you actually walk (see check())
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  // Floor colours are learned from the pixels under your feet (where you stand is always floor);
  // everything else that's mapped counts as wall. Until enough is learned, bright = floor is a guess.
  // Colours are binned 16 levels per channel: bin = r>>4, g>>4, b>>4.
  const binOf = (r, g, b) => (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
  let floorSet = null; // Uint8Array(4096), 1 = a floor colour
  try { const saved = JSON.parse(store.get('ct-floor') || 'null'); if (Array.isArray(saved) && saved.length) { floorSet = new Uint8Array(4096); for (const i of saved) floorSet[i] = 1; } } catch {}
  const floorBins = new Uint32Array(4096); let learned = 0;
  const wallLum = 45;
  const excluded = new Set(JSON.parse(store.get('ct-excluded') || '[]'));
  const cls = (r, g, b, a) => a <= 100 || (b > r + 20 && b > g + 20) ? 0
    : floorSet ? (floorSet[binOf(r, g, b)] ? 1 : 2) : (r + g + b) / 3 > wallLum ? 1 : 2;
  const copyKey = c => `${c.n}|${c.x0}`;
  const mod = (a, n) => ((a % n) + n) % n;
  // ---------- diagnostics: a short log you can copy and send ----------
  const logLines = [];
  function note(msg) {
    const t = new Date().toTimeString().slice(0, 8);
    if (logLines.length && logLines[logLines.length - 1].endsWith(msg)) return;
    logLines.push(`${t} ${msg}`); if (logLines.length > 40) logLines.shift();
    document.getElementById('diagLog').textContent = logLines.slice().reverse().join('\n');
  }
  window.addEventListener('error', e => note('錯誤：' + e.message));
  window.addEventListener('unhandledrejection', e => note('錯誤：' + (e.reason && e.reason.message || e.reason)));
  // where a marker is in the copy you're in now; null when its copy couldn't be lined up
  function at(m) {
    if (!m.world) return m.rel ? null : { x: m.x, z: m.z };
    if (!copies.length) return me && me.world && me.world.startsWith(m.world) ? { x: m.x, z: m.z } : null;
    const tx = Math.floor(m.x / TILE), c = copies.find(c => c.n.startsWith(m.world) && tx >= c.x0 - 3 && tx <= c.x1 + 3);
    return c && c.ok ? { x: m.x + c.dx, z: m.z + c.dz } : null;
  }
  const walkCache = new Map(); // "layer|x,z" -> Uint8Array(512*512) | null

  // ---------- markers (yours are saved by the mod; bundled ones ship with it) ----------
  async function loadMarkers() {
    try { const m = await (await fetch('/markers')).json(); markers = (Array.isArray(m) ? m : []).filter(x => !x.bundledDone); doneBundled = new Set((Array.isArray(m) ? m : []).filter(x => x.bundledDone).map(x => x.id)); } catch {}
    try { bundled = (await (await fetch('/bundled')).json()).map((b, i) => ({ ...b, id: 'b' + i, bundled: true, kind: b.kind || 'paper' })); } catch {}
    renderList(); draw();
  }
  function save() {
    const out = markers.concat([...doneBundled].map(id => ({ id, bundledDone: true })));
    fetch('/markers', { method: 'POST', body: JSON.stringify(out) }).catch(() => {});
  }
  const all = () => bundled.map(b => ({ ...b, done: doneBundled.has(b.id) })).concat(markers);
  const here = m => !me || !m.dim || m.dim === me.dim;
  function addMarker(x, y, z) {
    const kind = $('kind').value, n = markers.filter(m => m.kind === kind).length + 1;
    markers.push({ id: 'm' + Date.now(), dim: me ? me.dim : '', world: isBR() ? me.world : undefined, x: Math.floor(x), y: Math.floor(y), z: Math.floor(z), kind, label: $('label').value.trim() || `${KIND[kind][0]} ${n}`, done: false });
    $('label').value = ''; save(); renderList(); draw();
  }
  function renderList() {
    const ul = $('list'); ul.innerHTML = '';
    const list = all().filter(m => here(m) && at(m));
    if (!list.length) { ul.innerHTML = '<li class="empty">還沒有標記。找到紙張時按「標在我腳下」，或按「在地圖上點」再點地圖。</li>'; return; }
    for (const m of list.sort((a, b) => dist(a) - dist(b))) {
      const li = document.createElement('li'); if (m.done) li.className = 'done';
      li.innerHTML = `<span class="name"><span style="color:${KIND[m.kind][1]}">●</span> </span><span class="meta"></span><span class="acts"></span>`;
      li.querySelector('.name').append(m.label + (m.bundled ? '（內建）' : ''));
      const p = at(m);
      li.querySelector('.meta').textContent = `${p.x}, ${m.y ?? '?'}, ${p.z}` + (me ? ` · ${Math.round(dist(m))} 格` : '');
      const acts = li.querySelector('.acts');
      const b = (t, f, cls) => { const e = document.createElement('button'); e.type = 'button'; e.textContent = t; if (cls) e.className = cls; e.onclick = f; acts.append(e); };
      b('導航', () => navigate(m), 'nav');
      b(m.done ? '還沒拿' : '拿到了', () => { if (m.bundled) { m.done ? doneBundled.delete(m.id) : doneBundled.add(m.id); } else { const x = markers.find(k => k.id === m.id); x.done = !x.done; } save(); renderList(); draw(); });
      if (!m.bundled) b('刪除', () => { markers = markers.filter(k => k.id !== m.id); if (target && target.id === m.id) stopNav(); save(); renderList(); draw(); });
      ul.append(li);
    }
  }
  const dist = m => { const p = at(m); return !me ? 0 : p ? Math.hypot(p.x - me.x, p.z - me.z) : Infinity; };

  // ---------- position ----------
  function layerFor(y) {
    if (sel.value !== 'auto') return sel.value;
    const slice = String(Math.floor(y / 16));
    if (layers.includes(slice)) return slice;
    return layers.includes('day') ? 'day' : (layers[0] || 'day');
  }
  const layerName = l => ({ day: '地表（白天）', night: '地表（夜晚）', topo: '等高線', biome: '生物群系' }[l] || `地下 Y ${l * 16} ～ ${l * 16 + 15}`);
  let lastList = 0;
  async function poll() {
    try {
      const p = await (await fetch('/pos', { cache: 'no-store' })).json();
      if (!p.ok) { $('pos').textContent = '不在遊戲世界裡'; me = null; }
      else {
        me = p;
        $('pos').textContent = `X ${Math.floor(p.x)}  Y ${Math.floor(p.y)}  Z ${Math.floor(p.z)}`;
        $('dim').textContent = p.dim;
        if (p.layers.join() !== layers.join()) {
          layers = p.layers.slice().sort((a, b) => (isNaN(a) ? -1000 : +a) - (isNaN(b) ? -1000 : +b));
          const keep = sel.value; sel.length = 1;
          for (const l of layers) { const o = document.createElement('option'); o.value = l; o.textContent = layerName(l); sel.appendChild(o); }
          sel.value = layers.includes(keep) ? keep : 'auto';
        }
        $('note').hidden = p.found;
        $('note').textContent = 'JourneyMap 還沒存這個世界的地圖。走一下，等它存檔就會出現。';
        if (isBR()) $('dim').textContent = copies.length ? `後室 · 合併了 ${copies.filter(c => c.ok).length} / ${copies.length} 次的地圖` : '後室 · 地圖合併中…';
        if (follow) { view.cx = p.x; view.cz = p.z; }
        if (target) updateNav();
        if (isBR()) check();
        if (Date.now() - lastList > 1000) { lastList = Date.now(); renderList(); }
      }
    } catch {
      $('pos').textContent = '連不到遊戲：遊戲關掉了，或打過 /ct map off。回遊戲打 /ct map 再開一次。';
    }
    draw();
  }
  setInterval(poll, 250);
  setInterval(() => { version = Date.now(); tiles.clear(); if (!isBR()) walkCache.clear(); if (target) routeAt = 0; draw(); }, 10000);
  setInterval(() => { if (isBR()) { mergeJobs.clear(); draw(); } }, 60000);

  // ---------- checking the map against where you walk ----------
  // Where you stand is always floor. An older copy that puts walls under your feet more than now and then
  // (a lined-up copy almost never does; a shifted one does as often as walls cover the map) was lined
  // up wrong: it's dropped and lined up again. If your own copy keeps calling your floor a wall, the
  // darkness cut-off is wrong for this map and is lowered.
  let lastCheck = null;
  // your own copy's map agrees with your feet; until then a wall under you means the cut-off is off, not the copy
  const trusted = ref => ref.chk.n >= 20 && ref.chk.bad / ref.chk.n < 0.05;
  function check() {
    if (!copies.length || (lastCheck && Math.hypot(me.x - lastCheck.x, me.z - lastCheck.z) < 2)) return;
    lastCheck = { x: me.x, z: me.z };
    const X = Math.floor(me.x), Z = Math.floor(me.z), ref = copies.find(c => c.ref);
    for (const c of copies) {
      if (!c.ok || !c.mask) continue;
      const u = X - c.dx - c.x0 * TILE, v = Z - c.dz - c.z0 * TILE;
      if (u < 1 || v < 1 || u >= c.W - 1 || v >= c.H - 1) continue;
      const at = (du, dv) => c.mask[(v + dv) * c.W + u + du];
      if (!at(0, 0)) continue;
      c.chk.n++;
      if (at(0, 0) === 2) c.chk.bad++;
      if (c.ref) {
        const t = c.tiles.find(t => t.x === Math.floor(X / TILE) && t.z === Math.floor(Z / TILE));
        if (t && t.img) {
          const d = t.img.getContext('2d').getImageData(mod(X, TILE), mod(Z, TILE), 1, 1).data;
          if (d[3] > 100) { floorBins[binOf(d[0], d[1], d[2])]++; learned++; if (learned % 40 === 0) learnFloor(); }
        }
      } else if (ref && trusted(ref) && c.chk.n >= 40 && c.chk.bad / c.chk.n > 0.1) {
        note(`第 ${copies.indexOf(c) + 1} 次的地圖跟你走的路對不上（${Math.round(c.chk.bad / c.chk.n * 100)}% 站在牆上），已拿掉並重新對齊`);
        alignCache.delete(`${c.n}|${c.x0}|${ref.n}|${ref.x0}`);
        c.ok = false; mergeJobs.clear(); draw();
      }
    }
    renderDiag();
  }
  // The colours under your feet, most common first, until they cover 95% of your steps; each one
  // also takes its neighbouring bins so light and shade variations still count.
  function learnFloor() {
    const order = [...floorBins.keys()].filter(i => floorBins[i]).sort((x, y) => floorBins[y] - floorBins[x]);
    const total = order.reduce((n, i) => n + floorBins[i], 0), next = new Uint8Array(4096);
    let covered = 0;
    for (const i of order) {
      if (covered / total >= 0.95) break;
      covered += floorBins[i];
      const r = i >> 8, g = i >> 4 & 15, b = i & 15;
      for (let dr = -1; dr <= 1; dr++) for (let dg = -1; dg <= 1; dg++) for (let db = -1; db <= 1; db++) {
        const R = r + dr, G = g + dg, B = b + db;
        if (R >= 0 && G >= 0 && B >= 0 && R < 16 && G < 16 && B < 16) next[R << 8 | G << 4 | B] = 1;
      }
    }
    let changed = 0;
    for (let i = 0; i < 4096; i++) if (next[i] !== (floorSet ? floorSet[i] : 0)) changed++;
    if (floorSet && changed < 20) return;
    const first = !floorSet;
    floorSet = next;
    store.set('ct-floor', JSON.stringify([...next.keys()].filter(i => next[i])));
    const sample = order.slice(0, 3).map(i => `rgb(${(i >> 8) * 16 + 8},${(i >> 4 & 15) * 16 + 8},${(i & 15) * 16 + 8})`).join('、');
    note(`${first ? '學會' : '更新'}了地板的顏色（${learned} 步，最常見：${sample}），重新判斷牆和對齊`);
    alignCache.clear(); mergeJobs.clear(); walkCache.clear(); routeAt = 0; draw();
  }
  function renderDiag() {
    const box = document.getElementById('diagCopies'); box.innerHTML = '';
    const ok = copies.filter(c => c.ok).length;
    document.getElementById('diagSum').textContent = copies.length ? `${ok} / ${copies.length} 次對齊` : '';
    copies.forEach((c, i) => {
      const row = document.createElement('div'); row.className = 'row';
      const st = document.createElement('span');
      const walked = c.chk && c.chk.n ? `，走過驗證 ${c.chk.n - c.chk.bad}/${c.chk.n}` : '';
      st.textContent = `第 ${i + 1} 次（圖 ${c.x0}～${c.x1}）：` + (c.ref ? '你現在這間' + walked : c.ok ? `已對齊，牆吻合 ${Math.round((c.dice || 0) * 100)}%${walked}` : excluded.has(copyKey(c)) ? '你設定不用' : '對不上，跳過');
      st.className = c.ok ? 'good' : 'bad';
      row.append(st);
      if (!c.ref) {
        const b = document.createElement('button'); b.type = 'button';
        b.textContent = excluded.has(copyKey(c)) ? '使用' : '不用';
        b.onclick = () => {
          const k = copyKey(c);
          excluded.has(k) ? excluded.delete(k) : excluded.add(k);
          store.set('ct-excluded', JSON.stringify([...excluded]));
          note((excluded.has(k) ? '不用' : '改回使用') + `第 ${i + 1} 次的地圖`);
          mergeJobs.clear(); draw();
        };
        row.append(b);
      }
      box.append(row);
    });
    document.getElementById('diagCal').textContent = floorSet ? `地板顏色：已學會（走了 ${learned} 步）` : `地板顏色：學習中（${learned}/40 步，先用亮的當地板）`;
  }
  document.getElementById('realign').onclick = () => { alignCache.clear(); mergeJobs.clear(); note('手動重新對齊'); draw(); };
  document.getElementById('report').onclick = async () => {
    const lines = [
      '【即時地圖診斷】',
      me ? `位置 ${Math.floor(me.x)} ${Math.floor(me.y)} ${Math.floor(me.z)} · ${me.dim} · ${me.world || ''}` : '不在遊戲裡',
      `圖層 ${me ? layerFor(me.y) : '?'} · 地板顏色 ${floorSet ? '已學會 ' + floorSet.reduce((n, v) => n + v, 0) + ' 格' : '學習中'} · 走了 ${learned} 步 · 清楚地圖 ${clear ? '開' : '關'}`,
      ...copies.map((c, i) => `第${i + 1}次 圖${c.x0}~${c.x1} z${c.z0}~${c.z1} ${c.ref ? '現在' : c.ok ? `dx=${c.dx} dz=${c.dz} 牆${Math.round((c.dice || 0) * 100)}%` : `跳過（最好 牆${Math.round((c.dice || 0) * 100)}% ${c.both ?? '-'} 點）`} 驗證${c.chk ? (c.chk.n - c.chk.bad) + '/' + c.chk.n : '-'}`),
      `導航：${target ? target.label + ' · ' + document.getElementById('turn').textContent + ' ' + document.getElementById('left').textContent : '沒有'}`,
      `標記 ${all().length} 個`, '紀錄：', ...logLines.slice(-15)
    ].join('\n');
    const ta = document.getElementById('reportText'); ta.value = lines;
    try { await navigator.clipboard.writeText(lines); ta.hidden = true; note('診斷報告已複製，貼給 Claude 就好'); }
    catch { ta.hidden = false; ta.select(); note('不能自動複製：請在下面的框按 Ctrl+A、Ctrl+C'); }
  };

  // ---------- map images ----------
  function tile(layer, tx, tz) {
    const k = `${layer}|${tx},${tz}`, t = tiles.get(k);
    if (t) return t;
    const img = new Image();
    img.onload = draw;
    img.onerror = () => tiles.set(k, 'missing');
    img.src = `/tile/${layer}/${tx},${tz}.png?v=${version}`;
    tiles.set(k, img);
    return img;

  $('follow').onclick = () => setFollow(!follow);

  $('pick').onclick = () => setAdding(!adding);
  $('stop').onclick = stopNav;
  $('walk').onclick = () => { clear = !clear; $('walk').classList.toggle('on', clear); $('walk').textContent = clear ? '清楚地圖' : '原始地圖'; draw(); };
  $('nearest').onclick = () => {
    const left = all().filter(m => here(m) && m.kind === 'paper' && !m.done).sort((a, b) => dist(a) - dist(b));
    if (!left.length) { $('guide').hidden = false; $('turn').textContent = '沒有紙張標記'; $('left').textContent = '先標記紙張的位置，或等內建的紙張位置更新。'; return; }
    navigate(left[0]);
  };
  sel.onchange = () => { routeAt = 0; draw(); };
  new ResizeObserver(draw).observe(cv);
  loadMarkers(); poll();
})();
</script>
</body>
</html>
